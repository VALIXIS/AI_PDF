name: pdf_ai_toolkit
description: An AI-first PDF toolkit application for merging, splitting, and transforming PDFs with AI capabilities.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # PDF Handling
  pdf: ^3.10.0
  printing: ^5.11.0
  syncfusion_flutter_pdf: ^28.2.3
  
  # File & Storage
  file_picker: ^11.0.2
  path_provider: ^2.1.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  
  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  image_picker: ^1.2.2
  cunning_document_scanner: ^1.4.0
  share_plus: ^12.0.2
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
