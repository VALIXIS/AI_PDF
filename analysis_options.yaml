include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    deprecated_member_use: ignore
    missing_required_param: error
    missing_return: error
    todo: ignore

linter:
  rules:
    - avoid_empty_else
    - avoid_relative_lib_imports
    - empty_statements
    - valid_regexps
    - cancel_subscriptions
    - close_sinks
