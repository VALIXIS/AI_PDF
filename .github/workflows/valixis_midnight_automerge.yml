name: VALIXIS Midnight Auto-Merge Bot

on:
  schedule:
    # 12:00 AM Midnight IST is 18:30 UTC
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  midnight-merge:
    name: VALIXIS Midnight Autonomous PR Auto-Merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Midnight Auto-Merge & Conflict Prompt Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/automerge_bot.py

      - name: Upload Midnight Executive Briefing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midnight-automerge-briefing
          path: |
            MIDNIGHT_AUTOFOCUS_REPORT.md
            midnight_summary.json
          if-no-files-found: ignore
