version: '3.8'

services:
  ai-pdf-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valixis-ai-pdf
    ports:
      - "8085:80"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HF_API_KEY=${HF_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
